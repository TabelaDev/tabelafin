name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The install instructions used to say "download the repository ZIP,
      # unpack it, find the extension/ folder". That ships whatever the default
      # branch happens to be — which for a long stretch was 38 commits behind
      # the deployed app — and makes the user dig through a source tree to find
      # six files. A per-release artifact of just extension/ pins the extension
      # to the release it belongs to and is loadable straight from "Load
      # unpacked".
      - name: Package the browser extension
        run: |
          cd extension
          zip -r "../tabelafin-extensao-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tabelafin-extensao-*.zip
