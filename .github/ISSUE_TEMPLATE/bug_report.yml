name: Bug report
description: Reportar um comportamento incorreto no TabelaFin
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu
      description: Descreva o bug e o que você esperava que acontecesse em vez disso.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Vá em '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: navegador/versão, mobile/desktop, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Cole aqui logs relevantes ou screenshots. Nunca cole chaves de API, tokens ou credenciais do Meu Pluggy.
    validations:
      required: false
